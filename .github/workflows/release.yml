name: Build verified firmware release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install platformio==6.2.0
      - name: Verify both builds and all game rules
        run: |
          .venv/bin/python -m platformio run -e release -e debug
          .venv/bin/python scripts/test_host.py
      - name: Package firmware and check version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .venv/bin/python scripts/package_release.py --tag "$RELEASE_TAG"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/arcade-esp32-n16r8.bin dist/arcade-release.json dist/arcade-factory-esp32-n16r8.bin dist/SHA256SUMS.txt --verify-tag --title "Sly Arcade $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
