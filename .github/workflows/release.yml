name: Build verified firmware release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install platformio==6.2.0
      - name: Verify all board builds and game rules
        run: |
          .venv/bin/python -m platformio run -e release -e debug -e wroom-4mb -e wroom-16mb
          .venv/bin/python scripts/test_host.py --sanitize
      - name: Package firmware and check version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          .venv/bin/python scripts/package_release.py --tag "$RELEASE_TAG"
          .venv/bin/python scripts/package_release.py --env wroom-4mb --tag "$RELEASE_TAG"
          .venv/bin/python scripts/package_release.py --env wroom-16mb --tag "$RELEASE_TAG"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.bin dist/*.json dist/SHA256SUMS.txt --verify-tag --title "Game Arcade $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
