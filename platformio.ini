[platformio]
default_envs = release

[env]
platform = espressif32@6.10.0
board = esp-wrover-kit
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions_16mb.csv
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -include include/BoardConfig.h
build_unflags = -std=gnu++11

[env:migration]
build_src_filter = +<migration/> -<main.cpp> -<arcade/> -<games/>

[env:release]
build_src_filter = -<migration/> +<main.cpp> +<arcade/> +<games/>
build_type = release
lib_ignore =
  XboxSeriesXControllerESP32_asukiaaa
  XboxControllerNotificationParser
  XboxSeriesXHIDReportBuilder_asukiaaa
  NimBLE-Arduino

[env:debug]
extends = env:release
build_type = debug
build_flags = ${env.build_flags} -DARCADE_PROFILE=1

[env:no_psram]
extends = env:release
build_flags = ${env.build_flags} -DARCADE_FORCE_INTERNAL=1 -DARCADE_AUDIO=0

[env:one_button]
extends = env:release
build_flags = ${env.build_flags} -DARCADE_ONE_BUTTON=1

[env:expanded]
extends = env:release
build_flags = ${env.build_flags} -DARCADE_EXPANDED=1

[env:xbox]
extends = env:release
lib_ignore =
build_flags = ${env.build_flags} -DARCADE_XBOX=1
lib_deps =
  ${env.lib_deps}
  asukiaaa/XboxSeriesXControllerESP32_asukiaaa@1.1.1
  h2zero/NimBLE-Arduino@2.3.6
  asukiaaa/XboxControllerNotificationParser@1.0.5
  asukiaaa/XboxSeriesXHIDReportBuilder_asukiaaa@1.0.1
