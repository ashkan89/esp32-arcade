[platformio]
default_envs = release

[env]
platform = espressif32@6.10.0
board = esp-wrover-kit
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions_16mb.csv
monitor_speed = 115200
extra_scripts = pre:scripts/build_version.py
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@6.21.5
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -include include/BoardConfig.h
build_unflags = -std=gnu++11

[env:release]
build_type = release

[env:debug]
build_type = debug
build_flags = ${env.build_flags} -DARCADE_PROFILE=1
